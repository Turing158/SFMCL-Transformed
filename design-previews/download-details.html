      .retained-note { margin-top: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <svg class="sr-only" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="icon-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="icon-x" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
      <symbol id="icon-compare" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M12 4v16"/></symbol>
      <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="1"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></symbol>
    </defs>
  </svg>
  <main class="workspace">
    <p class="eyebrow">SFMCL-T / INTERFACE STUDY</p>
    <h1 class="page-title">文件下载详情 · 设计方案</h1>
    <p class="page-subtitle">三种信息组织方式，同一组文件。切换方案与数据场景，查看实际效果。</p>
    <div class="workbench">
      <div class="preview-column">
        <div class="variant-tabs" role="tablist" aria-label="设计方案">
          <button class="variant-tab" id="tab-a" role="tab" aria-selected="true" aria-controls="preview-panel" data-variant="a"><span class="tab-index">01</span>精简表格</button>
          <button class="variant-tab" id="tab-b" role="tab" aria-selected="false" tabindex="-1" aria-controls="preview-panel" data-variant="b"><span class="tab-index">02</span>进度表格</button>
          <button class="variant-tab" id="tab-c" role="tab" aria-selected="false" tabindex="-1" aria-controls="preview-panel" data-variant="c"><span class="tab-index">03</span>文件清单</button>
        </div>
        <div class="sample-bar">
          <div class="sample-picker">
            <label for="sample-select">数据场景</label>
            <select id="sample-select">
              <option value="single">单个文件 · 与截图一致</option>
              <option value="mixed">混合状态 · 8 个文件</option>
              <option value="many">长列表 · 201 个文件</option>
              <option value="empty">暂无文件</option>
            </select>
          </div>
          <button id="compare-original" class="compare-button" aria-pressed="false"><svg aria-hidden="true"><use href="#icon-compare"/></svg><span>对比原版</span></button>
        </div>
        <div id="preview-panel" role="tabpanel" aria-labelledby="tab-a">
          <section class="modal-shell" id="modal-preview" aria-labelledby="modal-title">
            <span class="surface-frame" aria-hidden="true"></span>
            <header class="modal-header">
              <h2 id="modal-title">文件下载详情</h2>
              <button id="close-preview" class="modal-close has-surface" aria-label="关闭文件下载详情预览"><span class="surface-frame" aria-hidden="true"></span><svg aria-hidden="true"><use href="#icon-x"/></svg></button>
            </header>
            <div class="modal-content">
              <div class="file-scroll variant-a" id="file-content" tabindex="0" role="region" aria-label="文件列表"></div>
              <nav class="pagination download-file-pagination" aria-label="文件下载分页">
                <button id="previous-page" class="button has-surface" disabled><span class="surface-frame" aria-hidden="true"></span>上一页</button>
                <span class="page-indicator has-surface" tabindex="0"><span class="surface-frame" aria-hidden="true"></span><span class="page-indicator-text" id="page-range">1–1 / 1</span></span>
                <button id="next-page" class="button has-surface" disabled><span class="surface-frame" aria-hidden="true"></span>下一页</button>
              </nav>
            </div>
          </section>
          <div class="closed-state" id="closed-preview" hidden><p>预览已关闭</p><button id="reopen-preview" class="reopen-button">重新打开预览</button></div>
        </div>
        <div class="preview-footnote"><span><svg aria-hidden="true"><use href="#icon-lock"/></svg>底部翻页区保持原样</span><span>HTML 独立预览 · 数据仅用于展示</span></div>
      </div>
      <aside class="design-note" aria-label="当前方案说明" aria-live="polite">
        <div class="note-title-block"><div class="note-number" id="note-number">01</div><h3 id="note-title">精简表格</h3><span class="recommendation" id="note-tag">推荐 · 最接近现有界面</span></div>
        <p class="note-description" id="note-description"></p>
        <ul class="note-features" id="note-features"></ul>
        <p class="retained-note"><svg aria-hidden="true"><use href="#icon-lock"/></svg><span>上一页、文件范围、下一页的样式和布局在三个方案中完全一致。</span></p>
      </aside>
    </div>
    <p id="page-announcement" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <script>
    const PAGE_SIZE = 100;
    const files = [
      { path: 'Zombie Invade 100 Days 2.3.mrpack', status: 'completed', downloaded: 28.6, total: 28.6, attempts: 1 },
      { path: 'mods/sodium-fabric-0.6.9+mc1.21.4.jar', status: 'running', downloaded: 1.2, total: 2.8, attempts: 1 },
      { path: 'mods/iris-fabric-1.8.8+mc1.21.4.jar', status: 'paused', downloaded: 1.1, total: 2.6, attempts: 1 },
      { path: 'resourcepacks/ComplementaryResources-1.21.4.zip', status: 'failed', downloaded: 4.8, total: 12.4, attempts: 3, error: '连接超时，等待重试。' },
      { path: 'assets/objects/7e/7ed58efab441b8d69d5c3e7fda69f6f98227db43', status: 'running', downloaded: 0.8, total: null, attempts: 1 },
      { path: 'config/zombie-invade/client-settings.json', status: 'queued', downloaded: 0, total: 0.2, attempts: 0 },
      { path: 'libraries/net/fabricmc/fabric-loader/0.16.14/fabric-loader-0.16.14.jar', status: 'completed', downloaded: 1.4, total: 1.4, attempts: 1 },
      { path: 'shaderpacks/ComplementaryReimagined_r5.4.zip', status: 'cancelled', downloaded: 2.1, total: 8.6, attempts: 1 }
    ];
    const states = {
      completed: ['已完成', 'check'], running: ['下载中', 'download'], paused: ['已暂停', 'pause'],
      failed: ['失败', 'alert'], queued: ['等待中', 'clock'], cancelled: ['已取消', 'x']
    };
    const notes = {
      a: { number: '01', title: '精简表格', tag: '推荐 · 最接近现有界面', description: '保留四列表格，用明确的列宽和轻量分隔线整理信息。视觉变化适中，适合直接替换当前表格。', features: [['文件名成为阅读起点', '图标、文件名和路径形成清楚的主次关系。'], ['状态更轻，数字更齐', '状态采用图标加文字，大小与尝试次数使用等宽数字。'], ['只强调进行中的进度', '已完成文件收起进度条，长列表也能保持简洁。']] },
      b: { number: '02', title: '进度表格', tag: '适合 · 同时下载多个文件', description: '让每个文件的进度都能一眼读出。保留四列结构，增加进度条与百分比，更适合观察正在进行的任务。', features: [['每行都有进度可读', '大小、百分比与进度条在同一列，减少来回查找。'], ['状态使用轻量标签', '完成、下载、暂停、失败同时提供文字与图标。'], ['异常信息就近呈现', '错误放在对应文件下方，未知大小不伪造百分比。']] },
      c: { number: '03', title: '文件清单', tag: '适合 · 少量文件与较长路径', description: '将每个文件整理为独立条目，减少传统表格的横向阅读。文件、状态、大小和尝试次数仍然全部保留。', features: [['一个文件，一个条目', '文件名在上，大小和尝试次数在下，阅读更自然。'], ['长名称有更多空间', '不再被固定列宽挤压，路径可以完整换行展示。'], ['按状态控制信息量', '完成条目简洁，下载和异常条目展开对应进度信息。']] },
      original: { number: '00', title: '原版对照', tag: '参照 · 当前截图布局', description: '根据截图和现有样式还原原版表格。可使用同一组数据对照，底部翻页区始终保持一致。', features: [['原来的四列', '文件、状态、大小 / 进度、尝试。'], ['自动列宽', '列宽由当前文件内容决定，缺少固定阅读节奏。'], ['普通文本呈现', '文件名与进度信息处于接近的视觉层级。']] }
    };
    let variant = ['a','b','c'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'a';
    let original = false;
    let sample = 'single';
    let offset = 0;
    const content = document.getElementById('file-content');
    const tabs = [...document.querySelectorAll('.variant-tab')];
    const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
    const icon = name => `<svg aria-hidden="true"><use href="#icon-${name}"/></svg>`;
    function currentFiles() {
      if (sample === 'empty') return [];
      if (sample === 'single') return files.slice(0,1);
      if (sample === 'mixed') return files;
      return Array.from({length: 201}, (_, index) => ({...files[index % files.length], path: index < 8 ? files[index].path : `mods/batch-${String(index + 1).padStart(3,'0')}/${files[index % files.length].path.split('/').pop()}`}));
    }
    function status(file) { const [label,glyph] = states[file.status]; return `<span class="status status-${file.status}">${icon(glyph)}${label}</span>`; }
    function size(file) { return `<span class="size-text"><strong>${file.downloaded.toFixed(1)} MB</strong> / ${file.total === null ? '未知大小' : file.total.toFixed(1) + ' MB'}</span>`; }
    function error(file) { return file.error ? `<div class="error-message">${icon('alert')}<span>${escapeHtml(file.error)}</span></div>` : ''; }
    function identity(file, includeError = true) {
      const parts = file.path.split('/'); const name = parts.pop(); const directory = parts.join('/');
      const extension = name.includes('.') ? name.split('.').pop().toUpperCase() + ' 文件' : '资源文件';
      return `<div class="file-identity"><span class="file-icon">${icon('file')}</span><div class="file-label"><div class="file-name" title="${escapeHtml(file.path)}">${escapeHtml(name)}</div><div class="file-meta">${escapeHtml(directory || extension)}</div>${includeError ? error(file) : ''}</div></div>`;
    }
    function percent(file) { return file.total === null ? '大小未知' : Math.round(Math.min(1, file.downloaded / file.total) * 100) + '%'; }
    function meter(file, always = false) {
      if (!always && ['completed','queued'].includes(file.status)) return '';
      if (file.total === null) return `<div class="progress-track unknown" role="progressbar" aria-label="${escapeHtml(file.path)} 下载进度，大小未知" aria-valuemin="0" aria-valuemax="100"></div>`;
      const value = Math.max(0, Math.min(1, file.downloaded / file.total));
      return `<div class="progress-track ${file.status}" role="progressbar" aria-label="${escapeHtml(file.path)} 下载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(value * 100)}"><span style="transform:scaleX(${value})"></span></div>`;
    }
    function table(rows, mode) {
      const header = `<thead><tr><th scope="col" class="file-name-cell">文件</th><th scope="col" class="file-status-cell">状态</th><th scope="col" class="file-progress-cell">大小 / 进度</th><th scope="col" class="file-attempt-cell">尝试</th></tr></thead>`;
      return `<div class="table-wrap"><table><caption class="sr-only">文件下载详情</caption>${header}<tbody>${rows.map(file => mode === 'original' ? `<tr><td style="overflow-wrap:anywhere">${escapeHtml(file.path)}${error(file)}</td><td><span class="original-status status-${file.status}">${states[file.status][0]}</span></td><td>${file.downloaded.toFixed(1)} MB / ${file.total === null ? '未知' : file.total.toFixed(1) + ' MB'}</td><td>${file.attempts}</td></tr>` : `<tr><td>${identity(file)}</td><td>${status(file)}</td><td>${mode === 'b' ? `<div class="progress-caption">${size(file)}<span class="progress-percent">${percent(file)}</span></div>${meter(file,true)}` : size(file) + meter(file)}</td><td class="file-attempt-cell"><span class="attempt-count">${file.attempts}</span></td></tr>`).join('')}</tbody></table></div>`;
    }
    function list(rows) {
      return `<div class="list-heading"><span>文件清单</span><span>本页 ${rows.length} 个文件</span></div><ul class="file-list">${rows.map(file => `<li class="file-item"><div class="file-item-top">${identity(file,false)}${status(file)}</div><div class="file-item-bottom">${size(file)}<span class="attempt-label">尝试 <span class="attempt-count">${file.attempts}</span> 次</span></div>${meter(file)}${error(file)}</li>`).join('')}</ul>`;
    }
    function render() {
      const mode = original ? 'original' : variant;
      const all = currentFiles();
      offset = Math.min(offset, Math.max(0, Math.ceil(all.length / PAGE_SIZE) - 1) * PAGE_SIZE);
      const rows = all.slice(offset,offset + PAGE_SIZE);
      content.className = `file-scroll variant-${mode}`;
      content.innerHTML = !rows.length ? `<div class="empty-state">${icon('file')}<strong>暂无文件</strong><p>下载任务中的文件会显示在这里。</p></div>` : mode === 'c' ? list(rows) : table(rows,mode);
      document.getElementById('page-range').textContent = `${rows.length ? offset + 1 : 0}–${rows.length ? offset + rows.length : 0} / ${all.length}`;
      document.getElementById('previous-page').disabled = offset === 0;
      document.getElementById('next-page').disabled = offset + PAGE_SIZE >= all.length;
      tabs.forEach(tab => { const active = tab.dataset.variant === variant; tab.setAttribute('aria-selected',String(active)); tab.tabIndex = active ? 0 : -1; });
      document.getElementById('preview-panel').setAttribute('aria-labelledby',`tab-${variant}`);
      const note = notes[mode];
      document.getElementById('note-number').textContent = note.number;
      document.getElementById('note-title').textContent = note.title;
      document.getElementById('note-tag').textContent = note.tag;
      document.getElementById('note-description').textContent = note.description;
      document.getElementById('note-features').innerHTML = note.features.map(([title,description]) => `<li><strong>${title}</strong><p>${description}</p></li>`).join('');
      document.getElementById('compare-original').setAttribute('aria-pressed',String(original));
      document.querySelector('#compare-original span').textContent = original ? '返回设计方案' : '对比原版';
    }
    function selectVariant(next, focus = false) {
      variant = next; original = false;
      history.replaceState(null,'',`#${variant}`);
      content.scrollTop = 0;
      render();
      if (focus) document.getElementById(`tab-${variant}`).focus();
    }
    tabs.forEach((tab,index) => {
      tab.addEventListener('click',() => selectVariant(tab.dataset.variant));
      tab.addEventListener('keydown',event => {
        if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
        event.preventDefault();
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? 2 : (index + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
        selectVariant(tabs[next].dataset.variant,true);
      });
    });
    document.getElementById('sample-select').addEventListener('change',event => { sample = event.target.value; offset = 0; content.scrollTop = 0; render(); });
    document.getElementById('compare-original').addEventListener('click',() => { original = !original; content.scrollTop = 0; render(); });
    function changePage(direction) { offset += direction * PAGE_SIZE; content.scrollTop = 0; render(); document.getElementById('page-announcement').textContent = `当前显示文件 ${document.getElementById('page-range').textContent}`; }
    document.getElementById('previous-page').addEventListener('click',() => changePage(-1));
    document.getElementById('next-page').addEventListener('click',() => changePage(1));
    document.getElementById('close-preview').addEventListener('click',() => { document.getElementById('modal-preview').hidden = true; document.getElementById('closed-preview').hidden = false; document.getElementById('reopen-preview').focus(); });
    document.getElementById('reopen-preview').addEventListener('click',() => { document.getElementById('modal-preview').hidden = false; document.getElementById('closed-preview').hidden = true; document.getElementById('close-preview').focus(); });
    window.addEventListener('hashchange',() => { if (['a','b','c'].includes(location.hash.slice(1))) selectVariant(location.hash.slice(1)); });
    render();
  </script>
</body>
</html>
