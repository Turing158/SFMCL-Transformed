# EasyTier v2.6.4 shared-node example. Run on a host reachable by all players.
# Open only the TCP/UDP ports below. Keep RPC on loopback; never expose it.
listeners = ["tcp://0.0.0.0:11010", "udp://0.0.0.0:11010"]
rpc_portal = "127.0.0.1:15888"
rpc_portal_whitelist = ["127.0.0.1/32"]

[network_identity]
network_name = "sfmcl-shared-node"
network_secret = "REPLACE-WITH-A-RANDOM-ADMINISTRATIVE-NETWORK-SECRET"

[flags]
no_tun = true
bind_device = false
disable_upnp = true
accept_dns = false
relay_network_whitelist = "sfmcl-*"

[[acl.acl_v1.chains]]
name = "block-local-inbound"
chain_type = 1
enabled = true
default_action = 2

[[acl.acl_v1.chains]]
name = "block-local-forward"
chain_type = 3
enabled = true
default_action = 2
