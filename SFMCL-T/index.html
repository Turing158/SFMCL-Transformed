<!doctype html>
<html lang="zh-CN" data-startup="loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#32785b" />
    <meta
      name="description"
      content="StarFall Minecraft Launcher-Transformed"
    />
    <title>SFMCL-T · StarFall Minecraft Launcher-Transformed</title>
    <link rel="stylesheet" href="/src/startup.css" />
  </head>
  <body>
    <div
      id="startup-screen"
      class="startup-screen"
      aria-label="SFMCL T 正在启动"
    >
      <div class="startup-panel">
        <div class="startup-drag-region" data-tauri-drag-region></div>
        <button
          id="startup-close"
          class="startup-close"
          type="button"
          aria-label="关闭窗口"
          hidden
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="m6 6 12 12M6 18 18 6" />
          </svg>
        </button>
        <div class="startup-mark" aria-hidden="true">
          <div class="startup-icon">
            <img
              class="startup-trail"
              src="/src-tauri/icons/icon.ico"
              alt=""
              draggable="false"
            />
            <img
              class="startup-trail"
              src="/src-tauri/icons/icon.ico"
              alt=""
              draggable="false"
            />
            <img
              class="startup-trail"
              src="/src-tauri/icons/icon.ico"
              alt=""
              draggable="false"
            />
            <img
              class="startup-trail"
              src="/src-tauri/icons/icon.ico"
              alt=""
              draggable="false"
            />
            <img
              class="startup-icon-main"
              src="/src-tauri/icons/icon.ico"
              alt=""
              draggable="false"
            />
          </div>
          <svg class="startup-wordmark" viewBox="0 0 400 104" fill="none">
            <defs></defs>
            <g class="startup-letters"></g>
            <g class="startup-pen"><circle r="5" opacity=".15" /></g>
            <g class="startup-wipe">
              <ellipse rx="4" ry="9" opacity=".19" />
              <path
                d="M-5-6h5M-7 0h6M-4 6h4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
                opacity=".18"
              />
            </g>
          </svg>
        </div>
        <span
          id="startup-status"
          class="startup-status"
          role="status"
          aria-live="polite"
          >正在准备界面，请稍候。</span
        >
        <div id="startup-error" class="startup-error" role="alert" hidden>
          <p id="startup-error-message"></p>
          <button id="startup-retry" class="startup-retry" type="button">
            重试启动
          </button>
        </div>
        <noscript>请启用 JavaScript 后重新打开 SFMCL-T。</noscript>
      </div>
    </div>
    <div id="root" inert aria-hidden="true" aria-busy="true"></div>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>
