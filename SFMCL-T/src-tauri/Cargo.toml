[package]
name = "sfmcl-t"
description = "StarFall Minecraft Launcher-Transformed"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sfmcl_t_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "x11", "dbus", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
sfmcl-t-core = { path = "../crates/launcher-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
anyhow = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
