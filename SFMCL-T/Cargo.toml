[workspace]
members = ["crates/launcher-core", "src-tauri"]
exclude = ["vendor/unrar-sys"]
default-members = ["crates/launcher-core"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[patch.crates-io]
unrar_sys = { path = "vendor/unrar-sys" }

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1
