[package]
name = "sfmcl-t-core"
description = "StarFall Minecraft Launcher-Transformed core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
fastnbt = "2"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
md-5 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4", default-features = false }
sevenz-rust = { version = "0.6", default-features = false, features = ["bzip2", "zstd"] }
unrar = "0.5"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
winreg = "0.56"

[dev-dependencies]
axum = "0.8"
sevenz-rust = { version = "0.6", features = ["compress"] }
